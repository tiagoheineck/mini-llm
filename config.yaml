# =============================================================
#  Parâmetros de treino da mini-LLM
#  Qualquer valor aqui pode ser sobrescrito na linha de comando:
#    docker compose run --rm train --learning_rate 1e-3 --max_iters 500
# =============================================================

# ---------- Dados ----------
data_path: data/input.txt   # texto usado para treinar
train_split: 0.9            # 90% treino, 10% validação

# ---------- Arquitetura do modelo (define o "tamanho" da LLM) ----------
block_size: 64      # janela de contexto: quantos tokens o modelo "enxerga" de uma vez
n_embd: 128         # dimensão dos embeddings (largura do modelo)
n_head: 4           # cabeças de atenção (n_embd precisa ser divisível por n_head)
n_layer: 4          # blocos Transformer empilhados (profundidade)
dropout: 0.1        # % de neurônios desligados aleatoriamente (combate overfitting)

# ---------- Otimização ----------
batch_size: 32        # quantas sequências por passo de treino
max_iters: 2000       # total de passos de treino
learning_rate: 1.0e-3 # tamanho do passo do otimizador (o parâmetro mais sensível!)
warmup_iters: 100     # passos iniciais em que o LR sobe de 0 até learning_rate
min_lr: 1.0e-4        # LR final (decai em cosseno até aqui)
weight_decay: 0.1     # regularização L2 (AdamW)
grad_clip: 1.0        # limita a norma do gradiente (evita "explosões")

# ---------- Avaliação / logs ----------
eval_interval: 200    # a cada N passos mede a loss de treino e validação
eval_iters: 50        # quantos batches usar para estimar a loss
sample_interval: 500  # a cada N passos gera um texto de exemplo
seed: 42              # semente aleatória (reprodutibilidade)

# ---------- Saída ----------
out_dir: outputs      # onde salvar checkpoint e histórico de loss
